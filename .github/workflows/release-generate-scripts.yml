# ==============================================================================
# PowerFlow — Stage Release Scripts (reusable workflow)
# ==============================================================================
# Called by  : .github/workflows/release.yml
# Responsibility: Stage the installers as release assets and generate
#                 RELEASE_NOTES.md from the CHANGELOG.
# Inputs     : version, tag_name
# Artifact   : release-scripts
# ==============================================================================
#
# NOTE (v3.0.0): this workflow used to GENERATE install.ps1 / uninstall.ps1 from
# here-strings baked into the YAML. That was a duplication trap — the generated
# installer could silently drift from the real install.ps1 in the repo, and did.
#
# The installers are now first-class source files, so we simply ship them. One
# installer, one source of truth. Same lesson as the Linux port itself.
# ==============================================================================

name: Stage Release Scripts

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: Version string (e.g. 3.0.0)
      tag_name:
        required: true
        type: string
        description: Full tag name (e.g. v3.0.0)

jobs:
  generate:
    name: 📝 Stage Release Scripts
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ✅ Verify the installers exist
        shell: bash
        run: |
          missing=0
          for f in install.ps1 uninstall.ps1 install.sh install-gui.sh; do
            if [ -f "$f" ]; then echo "  ✅ $f"
            else echo "::error::required installer missing: $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: 🔍 Shellcheck the bash installers
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          # SC1090/SC1091: shellcheck cannot follow dynamically-sourced files
          # (we source /etc/os-release, which only exists at runtime).
          shellcheck -e SC1090,SC1091 install.sh install-gui.sh
          echo "✅ shellcheck passed"

      - name: 📝 Generate Release Notes
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $tagName = "${{ inputs.tag_name }}"
          $notes   = ""

          if (Test-Path "CHANGELOG.md") {
            $log     = Get-Content "CHANGELOG.md" -Raw
            $pattern = "(?s)## \[$version\].*?(?=## \[|\z)"
            if ($log -match $pattern) {
              $notes = ($matches[0] -replace "## \[$version\][^\r\n]*[\r\n]*", "").Trim()
            }
          }

          if (-not $notes) {
            $notes = @(
              "## PowerFlow $version",
              "",
              "🚀 Enhanced terminal profile — smart navigation, Git workflows, and productivity tools.",
              "",
              "### 📚 Documentation",
              "- [Installation Guide](https://github.com/Syntax-Read3r/powerflow/blob/main/docs/installation.md)",
              "- [Features](https://github.com/Syntax-Read3r/powerflow/blob/main/docs/features.md)",
              "- [Troubleshooting](https://github.com/Syntax-Read3r/powerflow/blob/main/docs/troubleshooting.md)",
              "",
              "> Type ``pwsh-h`` after install for help."
            ) -join "`n"
          }

          # Always append the install commands so the release page has a
          # copy-pasteable one-liner regardless of what the CHANGELOG contains.
          $installBlock = @(
            "",
            "---",
            "",
            "## 📦 Installation",
            "",
            "**Windows (PowerShell):**",
            '```powershell',
            "irm https://github.com/Syntax-Read3r/powerflow/releases/download/$tagName/install.ps1 | iex",
            '```',
            "",
            "**Linux (terminal):**",
            '```bash',
            "curl -fsSL https://github.com/Syntax-Read3r/powerflow/releases/download/$tagName/install.sh | bash",
            '```',
            "",
            "**Linux (graphical installer):**",
            '```bash',
            "curl -fsSL https://github.com/Syntax-Read3r/powerflow/releases/download/$tagName/install-gui.sh -o install-gui.sh && bash install-gui.sh",
            '```',
            "",
            "> Linux keeps the GNU coreutils intact — ``rm``/``mv``/``cp``/``cat`` are untouched.",
            "> PowerFlow's own versions are ``del`` and ``mvf``.",
            "",
            "**Uninstall (either platform):**",
            '```',
            "powerflow-uninstall          # from inside PowerFlow",
            "bash install.sh --uninstall  # from a Linux terminal",
            '```'
          ) -join "`n"
          $notes = $notes.TrimEnd() + $installBlock

          Set-Content "RELEASE_NOTES.md" $notes -Encoding UTF8
          Write-Host "✅ Generated RELEASE_NOTES.md"

      - name: 📤 Upload release-scripts Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-scripts
          path: |
            install.ps1
            uninstall.ps1
            install.sh
            install-gui.sh
            RELEASE_NOTES.md
