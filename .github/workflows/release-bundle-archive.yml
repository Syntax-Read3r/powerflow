# ==============================================================================
# PowerFlow — Bundle Component Archive (reusable workflow)
# ==============================================================================
# Called by  : .github/workflows/release.yml
# Responsibility: Package the full modular layout (bootloader + config/ +
#                 components/ + docs) into powerflow-v{version}.zip and upload
#                 it as the 'component-archive' artifact.
# Inputs     : version
# Artifact   : component-archive
# ==============================================================================

name: Bundle Component Archive

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: Version string (e.g. 2.0.0)

jobs:
  bundle:
    name: 📦 Bundle Component Archive
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Create Component Zip
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $zipName = "powerflow-v$version.zip"

          # platform/ and windows-only/ are REQUIRED as of v3.0.0 — without the
          # adapter layer no components resolve and the profile fails to load.
          $paths = @(
            "Microsoft.PowerShell_profile.ps1",
            "config",
            "components",
            "platform",
            "windows-only",
            "install.ps1",
            "uninstall.ps1",
            "install.sh",
            "install-gui.sh",
            "COMPONENTS.md",
            "IMPORT_ORDER.md",
            "CHANGELOG.md",
            "README.md"
          )
          if (Test-Path "docs") { $paths += "docs" }

          foreach ($p in @("platform", "windows-only", "components", "config")) {
            if (-not (Test-Path $p)) { Write-Error "❌ Required path missing from the bundle: $p"; exit 1 }
          }

          Compress-Archive -Path $paths -DestinationPath $zipName -Force

          $size = (Get-Item $zipName).Length / 1KB
          Write-Host "✅ Created $zipName ($([math]::Round($size, 1)) KB)"

      - name: 📤 Upload component-archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: component-archive
          include-hidden-files: true
          path: |
            powerflow-v${{ inputs.version }}.zip
