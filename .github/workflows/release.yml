# ==============================================================================
# PowerFlow — Release Orchestrator
# ==============================================================================
# Triggered by: pushing a version tag (v*)
#
# This file is the entry point. It calls component workflows in declared order.
# To modify release behaviour, edit the relevant component file:
#
#   release-validate.yml          — version check, syntax, platform-separation gate
#   release-validate-linux.yml    — Linux install -> use -> uninstall, end to end
#   release-generate-scripts.yml  — install/uninstall scripts + release notes
#   release-bundle-archive.yml    — component zip archive
#   release-publish.yml           — create GitHub release with all assets
#   release-notify.yml            — post-release log / notifications
#
# validate-linux runs alongside the build jobs and BLOCKS publish. A release can
# no longer ship with a broken Linux port — which is exactly how the old one rotted.
# ==============================================================================

name: PowerFlow Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:

  # ── Stage 1: Validate ───────────────────────────────────────────────────────
  validate:
    uses: ./.github/workflows/release-validate.yml

  # ── Stage 2: Validate Linux + Build (parallel) ──────────────────────────────
  validate-linux:
    needs: validate
    uses: ./.github/workflows/release-validate-linux.yml

  generate-scripts:
    needs: validate
    uses: ./.github/workflows/release-generate-scripts.yml
    with:
      version:  ${{ needs.validate.outputs.version }}
      tag_name: ${{ needs.validate.outputs.tag_name }}

  bundle-archive:
    needs: validate
    uses: ./.github/workflows/release-bundle-archive.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  # ── Stage 3: Publish (blocked until Linux is proven working) ────────────────
  publish:
    needs: [validate, validate-linux, generate-scripts, bundle-archive]
    permissions:
      contents: write
    uses: ./.github/workflows/release-publish.yml
    with:
      version:  ${{ needs.validate.outputs.version }}
      tag_name: ${{ needs.validate.outputs.tag_name }}
    secrets: inherit

  # ── Stage 4: Notify ─────────────────────────────────────────────────────────
  notify:
    needs: [validate, publish]
    uses: ./.github/workflows/release-notify.yml
    with:
      version:  ${{ needs.validate.outputs.version }}
      tag_name: ${{ needs.validate.outputs.tag_name }}
