# ==============================================================================
# PowerFlow — Release Orchestrator
# ==============================================================================
# Triggered by: pushing a version tag (v*)
#
# This file is the entry point. It calls component workflows in declared order.
# To modify release behaviour, edit the relevant component file:
#
#   validate-release.yml   — version check, file existence, syntax test
#   generate-scripts.yml   — install/uninstall scripts + release notes
#   bundle-archive.yml     — component zip archive + ubuntu/.bashrc
#   publish-release.yml    — create GitHub release with all assets
#   notify-release.yml     — post-release log / notifications
#
# generate-scripts and bundle-archive run in parallel (no dependency on each other).
# ==============================================================================

name: PowerFlow Release

on:
  push:
    tags:
      - 'v*'

jobs:

  # ── Stage 1: Validate ───────────────────────────────────────────────────────
  validate:
    uses: ./.github/workflows/components/validate-release.yml

  # ── Stage 2: Build (parallel) ───────────────────────────────────────────────
  generate-scripts:
    needs: validate
    uses: ./.github/workflows/components/generate-scripts.yml
    with:
      version:  ${{ needs.validate.outputs.version }}
      tag_name: ${{ needs.validate.outputs.tag_name }}

  bundle-archive:
    needs: validate
    uses: ./.github/workflows/components/bundle-archive.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  # ── Stage 3: Publish ────────────────────────────────────────────────────────
  publish:
    needs: [validate, generate-scripts, bundle-archive]
    uses: ./.github/workflows/components/publish-release.yml
    with:
      version:  ${{ needs.validate.outputs.version }}
      tag_name: ${{ needs.validate.outputs.tag_name }}
    secrets: inherit

  # ── Stage 4: Notify ─────────────────────────────────────────────────────────
  notify:
    needs: [validate, publish]
    if: success()
    uses: ./.github/workflows/components/notify-release.yml
    with:
      version:  ${{ needs.validate.outputs.version }}
      tag_name: ${{ needs.validate.outputs.tag_name }}
