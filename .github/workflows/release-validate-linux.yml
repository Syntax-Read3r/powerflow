# ==============================================================================
# PowerFlow — Validate Linux (reusable workflow)
# ==============================================================================
# Called by  : .github/workflows/release.yml
# Responsibility: Prove the Linux port actually works, end to end, on a real box:
#                 INSTALL -> LOAD -> USE -> UNINSTALL.
#
# This is the guard the old Ubuntu port never had. It shipped for months as a
# parallel bash re-implementation that nobody exercised, and it silently rotted.
# If this job passes, Linux genuinely works. If it fails, the release stops.
# ==============================================================================

name: Validate Linux

on:
  workflow_call:

jobs:

  # ============================================================================
  # Distro matrix — the installer must work on more than the CI runner's Ubuntu.
  #
  # v3.0.0 shipped an installer that could not install PowerShell on Debian at all:
  # it built an *Ubuntu* repo URL from the distro's VERSION_ID, then fell back to a
  # hardcoded debian/12 repo whose SHA1-signed key modern apt rejects. Nobody caught
  # it because every test ran on Ubuntu. A real user found it on a Proxmox server.
  #
  # Every package manager PowerFlow claims to support is now exercised on a real
  # container of that distro, on every release.
  # ============================================================================
  distros:
    name: 📦 Install on ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Debian 13 (apt)",   image: "debian:13",                   pm: apt    }
          - { name: "Debian 12 (apt)",   image: "debian:12",                   pm: apt    }
          - { name: "Ubuntu 24.04 (apt)",image: "ubuntu:24.04",                pm: apt    }
          - { name: "Ubuntu 22.04 (apt)",image: "ubuntu:22.04",                pm: apt    }
          - { name: "Fedora (dnf)",      image: "fedora:42",                   pm: dnf    }
          - { name: "Arch (pacman)",     image: "archlinux:latest",            pm: pacman }
          - { name: "openSUSE (zypper)", image: "opensuse/tumbleweed:latest",  pm: zypper }
          - { name: "Alpine (apk/musl)", image: "alpine:latest",               pm: apk    }

    steps:
      - name: 🧰 Bootstrap the container
        shell: sh
        run: |
          set -e
          case "${{ matrix.pm }}" in
            apt)    apt-get update -qq && apt-get install -y -qq bash sudo curl ca-certificates git ;;
            dnf)    dnf install -y -q bash sudo curl ca-certificates git tar ;;
            pacman) pacman -Sy --noconfirm bash sudo curl ca-certificates git tar ;;
            zypper) zypper --non-interactive install bash sudo curl ca-certificates git tar gzip ;;
            apk)    apk add --quiet bash sudo curl ca-certificates git tar ;;
          esac

      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Install PowerFlow (as root, from this checkout)
        shell: bash
        # GITHUB_TOKEN: the tarball path asks api.github.com for the latest pwsh
        # release, and ANONYMOUS calls from shared runner IPs get 403 rate-limited —
        # that exact 403 killed the v3.3.2 release on this job's Arch leg. install.sh
        # uses the token when present; interactive users never need one.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash ./install.sh --yes

      # `command -v pwsh` is NOT enough — the binary archive can place a pwsh that
      # exists on PATH but dies instantly with "Couldn't find a valid ICU package".
      # It must actually RUN.
      - name: 🐚 PowerShell must actually run
        shell: bash
        run: |
          pwsh --version || { echo "::error::pwsh is installed but cannot run on ${{ matrix.name }}"; exit 1; }

      - name: 🔧 Dependencies installed
        shell: bash
        run: |
          fail=0
          for t in starship fzf zoxide lsd git; do
            if command -v "$t" >/dev/null 2>&1; then echo "  ok $t"
            else echo "::error::${{ matrix.name }}: dependency missing: $t"; fail=1; fi
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: 🚀 Profile loads and coreutils stay unshadowed
        shell: bash
        run: |
          pwsh -NoProfile -Command '
            . "$HOME/.config/powershell/Microsoft.PowerShell_profile.ps1" *>$null
            if ($script:PowerFlowOS -ne "linux") { Write-Error "platform=$script:PowerFlowOS"; exit 1 }
            foreach ($t in "rm","mv","cp","cat","grep") {
              $c = Get-Command $t -EA SilentlyContinue
              if (-not $c -or $c.CommandType -ne "Application") { Write-Error "$t is shadowed!"; exit 1 }
            }
            foreach ($c in "nav","git-a","del","mvf","pwsh-h") {
              if (-not (Get-Command $c -EA SilentlyContinue)) { Write-Error "missing: $c"; exit 1 }
            }
            Write-Host "OK — loads, coreutils intact, del/mvf present"
          '

  linux:
    name: 🐧 Validate Linux (install → use → uninstall)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐚 Install PowerShell
        shell: bash
        run: |
          sudo snap install powershell --classic
          pwsh --version

      - name: 🧪 Parse every .ps1 under pwsh on Linux
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $bad++; Write-Host "::error file=$($_.FullName)::$($errs[0].Message)" }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Host "✅ All .ps1 parse under Linux pwsh"

      - name: 📦 Install PowerFlow (non-interactive, WITH dependencies)
        shell: bash
        run: |
          # git is pre-installed on the runner. It must be recorded as
          # installedByPowerFlow=false and must SURVIVE the uninstall below.
          command -v git >/dev/null || { echo "::error::expected git preinstalled"; exit 1; }

          bash ./install.sh --yes

          test -f "$HOME/.config/powershell/Microsoft.PowerShell_profile.ps1" \
            || { echo "::error::profile was not installed"; exit 1; }
          test -d "$HOME/.config/powershell/platform/linux/adapters" \
            || { echo "::error::linux adapters were not installed"; exit 1; }
          test -f "$HOME/.config/powershell/.powerflow-manifest.json" \
            || { echo "::error::manifest was not written"; exit 1; }

          # `git-rl -h` READS these at runtime to write a setup guide into a user's
          # project. They are a dependency, not documentation — install.ps1 originally
          # copied only config/components/platform/windows-only, so git-rl -h found
          # nothing after a real install and had to fall back to a network fetch.
          test -f "$HOME/.config/powershell/docs/git-rl/SETUP-PROMPT.md" \
            || { echo "::error::docs/git-rl/SETUP-PROMPT.md did not survive install — git-rl -h will break"; exit 1; }
          test -f "$HOME/.config/powershell/docs/git-rl/README.md" \
            || { echo "::error::docs/git-rl/README.md did not survive install"; exit 1; }

          echo "✅ installed (including the git-rl runtime docs)"

      # Dependency install is where the real breakage hides: apt needs an index
      # refresh on a clean box, and starship/lsd are not in Ubuntu's repos at all,
      # so they must come from GitHub. If any of this regresses, PowerFlow "installs"
      # but ls has no lsd and the prompt has no starship.
      - name: 🔧 Every dependency actually installed
        shell: bash
        run: |
          fail=0
          for t in starship fzf zoxide lsd git; do
            if command -v "$t" >/dev/null 2>&1; then echo "  ✅ $t -> $(command -v $t)"
            else echo "::error::dependency not installed: $t"; fail=1; fi
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: 🚀 Load the profile and exercise it
        shell: pwsh
        run: |
          . "$HOME/.config/powershell/Microsoft.PowerShell_profile.ps1"

          if ($script:PowerFlowOS -ne 'linux') {
            Write-Error "❌ platform detected as '$script:PowerFlowOS', expected 'linux'"; exit 1
          }
          Write-Host "✅ platform detected: linux"

          # Adapters must be present
          $adapters = @('Copy-ToClipboard','Test-Admin','Install-Dependency','New-TerminalTab',
                        'Invoke-Shutdown','Add-PersistentPathEntry','Get-TempPath','Get-PackageManagerName')
          foreach ($a in $adapters) {
            if (-not (Get-Command $a -EA SilentlyContinue)) { Write-Error "❌ adapter missing: $a"; exit 1 }
          }
          Write-Host "✅ all $($adapters.Count) adapters loaded"

          # Commands must be present
          foreach ($c in @('nav','git-a','pwsh-h','set-path','ls','del','mvf')) {
            if (-not (Get-Command $c -EA SilentlyContinue)) { Write-Error "❌ command missing: $c"; exit 1 }
          }
          Write-Host "✅ commands available"

          # WSL launchers must NOT load on Linux
          foreach ($w in @('open-ubuntu','open-wsl-simple')) {
            if (Get-Command $w -EA SilentlyContinue) { Write-Error "❌ Windows-only '$w' leaked onto Linux"; exit 1 }
          }
          Write-Host "✅ windows-only/ correctly excluded"

          # pwsh-h must render — asserted against REGISTRY DATA, not menu prose.
          # The old check matched literal strings from the hand-drawn menu; when the
          # menu became registry-generated the strings vanished and the check failed a
          # release whose pwsh-h worked perfectly. Section names below come from
          # $script:PF_HelpSections and command names from Register-PFCommand calls —
          # if these are absent, the registry genuinely did not render.
          # NOTE the 6>&1 — pwsh-h uses Write-Host (the information stream), so
          # `pwsh-h | Out-String` is EMPTY even on a working build. Redirected output
          # also forces print mode, so this can never hang waiting on fzf.
          $help = pwsh-h -all 6>&1 | Out-String
          if ($help -notmatch 'SMART NAVIGATION') { Write-Error "❌ pwsh-h did not render its sections"; exit 1 }
          if ($help -notmatch '\bgit-rl\b' -or $help -notmatch '\bsrv\b') { Write-Error "❌ pwsh-h is missing registered commands"; exit 1 }
          # The Linux-shadowing story is registry data now: del/mvf are Platform=Linux
          # entries and MUST appear in a Linux render.
          if ($help -notmatch '\bdel\b' -or $help -notmatch '\bmvf\b') { Write-Error "❌ pwsh-h is missing the Linux del/mvf entries"; exit 1 }
          Write-Host "✅ pwsh-h renders from the registry (and documents del/mvf)"

      - name: 🛡️ THE regression that matters — coreutils are not shadowed
        shell: pwsh
        run: |
          . "$HOME/.config/powershell/Microsoft.PowerShell_profile.ps1"

          # PowerFlow's rm deletes a directory tree recursively after one prompt.
          # GNU rm REFUSES without -r. If PowerFlow's rm ever shadows /usr/bin/rm
          # on Linux, a user with muscle memory loses a directory. Never again.
          $failed = $false
          foreach ($tool in @('rm','mv','cp','cat','mkdir','touch','rmdir','which','grep')) {
            $cmd = Get-Command $tool -EA SilentlyContinue
            if (-not $cmd) { Write-Error "❌ '$tool' resolves to nothing"; $failed = $true; continue }
            if ($cmd.CommandType -ne 'Application') {
              Write-Error "❌ '$tool' is shadowed by a PowerFlow $($cmd.CommandType) — GNU $tool is unreachable!"
              $failed = $true
            } else {
              Write-Host "  ✅ $tool -> $($cmd.Source)"
            }
          }
          if ($failed) { exit 1 }

          # ...and the renamed PowerFlow versions still exist
          foreach ($f in @('del','mvf')) {
            if ((Get-Command $f -EA SilentlyContinue).CommandType -ne 'Function') {
              Write-Error "❌ PowerFlow's '$f' is missing — the feature was lost, not renamed"; exit 1
            }
          }
          Write-Host "✅ coreutils intact; PowerFlow features preserved as del/mvf"

      # PowerFlow only loads when pwsh runs. --login-shell auto wires it into ~/.bashrc.
      # It MUST be idempotent, MUST NOT fire for non-interactive shells (scp/cron would
      # break), and MUST NOT be able to lock a user out if pwsh disappears.
      - name: 🐚 --login-shell auto is safe and idempotent
        shell: bash
        run: |
          bash ./install.sh --yes --login-shell auto >/dev/null 2>&1

          grep -q "PowerFlow: launch pwsh" "$HOME/.bashrc" \
            || { echo "::error::--login-shell auto did not install the ~/.bashrc hook"; exit 1; }

          # Idempotent: running it again must not duplicate the block.
          bash ./install.sh --yes --login-shell auto >/dev/null 2>&1
          n=$(grep -c "PowerFlow: launch pwsh" "$HOME/.bashrc")
          [ "$n" -eq 1 ] || { echo "::error::hook duplicated ($n copies) — not idempotent"; exit 1; }

          # A non-interactive shell must NEVER exec pwsh, or scp/rsync/cron break.
          out=$(bash -c 'echo STILL_BASH')
          [ "$out" = "STILL_BASH" ] \
            || { echo "::error::non-interactive bash exec'd pwsh — this breaks scp/cron"; exit 1; }

          # THE LOCKOUT GUARD: if pwsh vanishes, the user must still get a shell.
          #
          # The hook's third guard is `command -v pwsh`, so the honest way to test it is to
          # run an interactive bash in which pwsh is NOT FINDABLE.
          #
          # Do NOT do that by moving the binary. This step used to run
          #     sudo mv "$(command -v pwsh)" /tmp/pwsh.bak
          # which moves only the FIRST pwsh on PATH. The runner has pwsh preinstalled at
          # /usr/bin/pwsh *and* a snap at /snap/bin/pwsh, so the other one stayed
          # resolvable, the hook fired, and `exec pwsh` replaced bash before `echo
          # SURVIVED` could run. The test then reported a lockout that did not exist —
          # and its restore line would have dropped the snap symlink on top of the
          # preinstalled /usr/bin/pwsh.
          #
          # Instead: build a sandbox PATH holding only the tools ~/.bashrc needs, and no
          # pwsh at all. Nothing is moved, so nothing has to be put back.
          SANDBOX="$(mktemp -d)"
          for t in bash cat grep sed ls env dirname tput uname id; do
            src="$(command -v "$t" 2>/dev/null)" && ln -s "$src" "$SANDBOX/$t"
          done
          command -v pwsh >/dev/null || { echo "::error::pwsh missing before the test even ran"; exit 1; }
          env PATH="$SANDBOX" bash -ic 'command -v pwsh' >/dev/null 2>&1 \
            && { echo "::error::sandbox still resolves pwsh — the test would prove nothing"; exit 1; }

          # `|| true` matters. If the hook IS broken, exec'ing a missing pwsh kills that
          # bash with 127 — and under `set -e -o pipefail` the step would then abort right
          # here, before the ::error:: below ever prints. CI would show a bare red X with
          # no explanation. Swallow the status, then assert, so the failure explains itself.
          out=$(env PATH="$SANDBOX" bash -ic 'echo SURVIVED' 2>/dev/null | tail -1) || true
          rm -rf "$SANDBOX"

          [ "$out" = "SURVIVED" ] \
            || { echo "::error::pwsh unreachable and the user was LOCKED OUT of their shell (got: '$out')"; exit 1; }

          # And pwsh is of course still installed — we never touched it.
          command -v pwsh >/dev/null || { echo "::error::the lockout test damaged the pwsh install"; exit 1; }

          echo "✅ login hook: installed, idempotent, non-interactive-safe, no lockout"

      - name: 🗑️ Uninstall cleanly — and DO NOT remove tools the user already had
        shell: bash
        run: |
          pwsh -NoProfile -File "$HOME/.config/powershell/uninstall.ps1" -Yes

          # 1. Nothing left behind
          for p in "Microsoft.PowerShell_profile.ps1" "components" "platform" "config" ".powerflow-manifest.json"; do
            if [ -e "$HOME/.config/powershell/$p" ]; then
              echo "::error::uninstall left $p behind"; exit 1
            fi
          done

          # 2. THE SAFETY GUARANTEE. git was on the runner BEFORE PowerFlow, so the
          #    manifest marks it installedByPowerFlow=false and uninstall must not
          #    touch it. The old uninstaller ripped out shared tools regardless of
          #    who installed them; that must never happen again.
          command -v git >/dev/null 2>&1 \
            || { echo "::error::uninstall removed git — but the user already had it!"; exit 1; }

          # 3. Tools PowerFlow DID install must actually be gone. Removals must run
          #    one-per-package: batching makes apt abort the whole command when one
          #    name is not an apt package, silently leaving everything installed.
          for t in starship lsd zoxide; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "::error::uninstall claimed to remove $t but it is still present"; exit 1
            fi
          done

          echo "✅ uninstalled cleanly; pre-existing git survived; PowerFlow's tools removed"

      - name: ✅ Linux validated
        run: echo "install → load → use → uninstall all passed on Linux"
