# ==============================================================================
# PowerFlow — Validate Release (reusable workflow)
# ==============================================================================
# Called by  : .github/workflows/release.yml
# Responsibility: Verify the tag version matches the settings file, all required
#                 files exist, and the bootloader parses without syntax errors.
# Outputs    : version (e.g. 2.0.0), tag_name (e.g. v2.0.0)
# ==============================================================================

name: Validate Release

on:
  workflow_call:
    outputs:
      version:
        description: Parsed version string (e.g. 2.0.0)
        value: ${{ jobs.validate.outputs.version }}
      tag_name:
        description: Full tag name (e.g. v2.0.0)
        value: ${{ jobs.validate.outputs.tag_name }}

env:
  PROFILE_FILE:    Microsoft.PowerShell_profile.ps1
  SETTINGS_FILE:   config/PowerFlow.settings.ps1

jobs:
  validate:
    name: 🔍 Validate Release
    runs-on: windows-latest
    outputs:
      version:  ${{ steps.parse_tag.outputs.version }}
      tag_name: ${{ steps.parse_tag.outputs.tag_name }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🏷️ Parse Version from Tag
        id: parse_tag
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          $version  = $tagName -replace '^v', ''
          "version=$version"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "🏷️  Tag: $tagName  |  📦 Version: $version"

      - name: ✅ Validate Required Files Exist
        shell: pwsh
        run: |
          $required = @(
            "${{ env.PROFILE_FILE }}",
            "${{ env.SETTINGS_FILE }}"
          )
          $failed = $false
          foreach ($f in $required) {
            if (Test-Path $f) { Write-Host "✅ $f" }
            else { Write-Error "❌ Required file missing: $f"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: 🔍 Validate Version in Settings File
        shell: pwsh
        run: |
          $expected = "${{ steps.parse_tag.outputs.version }}"

          # Primary check: config/PowerFlow.settings.ps1 (v2.0.0+ modular layout)
          $content = Get-Content "${{ env.SETTINGS_FILE }}" -Raw
          if ($content -notmatch '\$script:POWERFLOW_VERSION = "([^"]+)"') {
            Write-Error "❌ POWERFLOW_VERSION not found in ${{ env.SETTINGS_FILE }}"
            exit 1
          }
          $found = $matches[1]
          $isPreRelease = $expected -match '-'
          Write-Host "📦 Settings: $found  |  🏷️ Tag: $expected  |  Pre-release: $isPreRelease"
          if ($found -ne $expected) {
            if ($isPreRelease) {
              Write-Warning "⚠️  Version mismatch (pre-release tag — skipping hard fail): settings=$found tag=$expected"
            } else {
              Write-Error "❌ Version mismatch — update POWERFLOW_VERSION in ${{ env.SETTINGS_FILE }} to $expected"
              exit 1
            }
          }

          Write-Host "✅ Version validated"

      - name: 🧪 Test Bootloader Syntax
        shell: pwsh
        run: |
          try {
            $null = [System.Management.Automation.PSParser]::Tokenize(
              (Get-Content "${{ env.PROFILE_FILE }}" -Raw), [ref]$null)
            Write-Host "✅ Bootloader syntax valid"
          } catch {
            Write-Error "❌ Syntax error in ${{ env.PROFILE_FILE }}: $($_.Exception.Message)"
            exit 1
          }

      # The architectural invariant: components/ must never call an OS API directly.
      # It must go through platform/<os>/adapters/. If this fails, the Linux port
      # is broken even if Windows still works — which is exactly how the old port
      # rotted without anyone noticing.
      - name: 🚧 Enforce Platform Separation
        shell: pwsh
        run: |
          $forbidden = 'Set-Clipboard|Get-Clipboard|explorer\.exe|\bscoop\b|Start-Process "wt"|WindowsPrincipal|shutdown\.exe|SetEnvironmentVariable|System\.Windows\.Forms|winget|\bpowercfg\b|Get-CimInstance|Get-WinEvent|\$env:(TEMP|USERPROFILE|LOCALAPPDATA|APPDATA|SystemRoot)'
          $hits = Get-ChildItem components -Recurse -Filter *.ps1 |
                  Where-Object { $_.Name -ne 'create-next.ps1' } |   # generated-project template
                  Select-String -Pattern $forbidden |
                  Where-Object { $_.Line -notmatch '^\s*#' }         # comments are fine

          if ($hits) {
            Write-Error "❌ components/ calls an OS API directly — it must use a platform adapter:"
            $hits | ForEach-Object { Write-Host "   $($_.RelativePath ?? $_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            exit 1
          }
          Write-Host "✅ components/ is platform-agnostic"

      # PowerShell resolves a bare name as Alias -> Function -> Cmdlet -> native binary. So a
      # FUNCTION beats a native binary, and an ALIAS beats a function. Anything in components/
      # named after a GNU coreutil therefore HIDES the real tool on Linux — and does it
      # silently, with different semantics, which is the worst way for a shell to differ.
      #
      # This used to be handled the other way around: components/ claimed rm/mv/cp/cat/mkdir/
      # touch, and platform/linux/bindings.ps1 unpicked them all afterwards. That is fail-
      # dangerous — the shadowing was unconditional and the undo conditional — and that file's
      # own header recorded the bug shipping once. The rule is now structural: never claim the
      # name. PowerFlow's own file commands are `del` and `mvf` on every platform, and the
      # Windows-only clones live in windows-only/coreutils.ps1.
      #
      # Checked statically against the source, IN ADDITION to the runtime check that
      # release-validate-linux.yml already performs (it installs PowerFlow on an Alpine/Arch
      # matrix, loads the profile, and asserts rm/mv/cp/cat/grep resolve to Application). Both are
      # wanted: that one proves the real behaviour, this one fails on the ROOT CAUSE — the name, in
      # the file that defines it — before anything is installed.
      - name: 🐧 Coreutil names are not shadowed
        shell: pwsh
        run: |
          $coreutils = @(
            'rm','mv','cp','cat','mkdir','touch','rmdir','which','grep','less','pwd',
            'head','tail','wc','ln','chmod','chown','df','du','ps','kill','sed','awk',
            'find','sort','uniq','tar','date','echo','env','id','man','mount','sleep',
            'tee','diff','file','stat','seq','tr','cut','basename','dirname','realpath',
            'readlink','truncate','link','unlink','mktemp','nproc','printf','whoami',
            'hostname','uname','free','top','ls'
          )
          # `ls` (and its la/ll shorthands) is the ONE deliberate override: the pretty listing
          # is the whole point of it, it accepts GNU flags, and it degrades to Get-ChildItem
          # when lsd is absent. Every other name on that list must be left to the real tool.
          $allowed = @('ls', 'la', 'll')

          $hits = @()
          foreach ($f in (Get-ChildItem components -Recurse -Filter *.ps1)) {
            foreach ($pattern in @('^function ([a-z][\w\.-]*)\b', '^Set-Alias(?: -Name)? ([a-z][\w\.-]*)')) {
              # -CaseSensitive is load-bearing here for the same reason as the help gate:
              # PowerShell regex is case-insensitive by default, so [a-z] would also match
              # every Verb-Noun helper and drown the real signal.
              $hits += Select-String -CaseSensitive -Path $f.FullName -Pattern $pattern | ForEach-Object {
                $name = $_.Matches[0].Groups[1].Value
                if (($name -cin $coreutils) -and ($name -cnotin $allowed)) {
                  "   $name  defined at components/$($f.Directory.Name)/$($f.Name):$($_.LineNumber)"
                }
              }
            }
          }

          if ($hits) {
            Write-Error "❌ components/ defines a name that belongs to a GNU coreutil — it would shadow the real tool on Linux:"
            $hits | ForEach-Object { Write-Host $_ }
            Write-Host ""
            Write-Host "   Give it a PowerFlow name that works on both platforms (see del/mvf), or"
            Write-Host "   put it in windows-only/ if it is a clone of a tool only Windows lacks."
            exit 1
          }
          Write-Host "✅ components/ claims no coreutil name (ls/la/ll allow-listed as deliberate overrides)"

      # THE FLAG CONVENTION (docs/plan/ethos/ETHOS.md): one dash for a single letter, two for a
      # word. Help text is how a convention propagates, so an -Example teaching `-status` where
      # the rule says `--status` actively undoes the migration — a user reads the help, types
      # what it showed, and gets a deprecation notice for a spelling PowerFlow handed them.
      #
      # A SHORT form is one or two letters — `-f`, `-sh`, and GNU bundles like `-rf`/`-la` fall
      # out of that naturally. Only tokens of THREE or more characters are words, and a word
      # takes two dashes.
      - name: 🏷️ Registered help teaches the canonical flag spelling
        shell: pwsh
        run: |
          # The remaining exceptions, each for a stated reason. Every entry here is a DOC nit if
          # it goes stale, not a shipped defect — unlike an allow-list that guards behaviour, it
          # cannot hide a bug by being out of date.
          $allowed = @{
            '-fdx'   = 'git clean -fdx — a GNU bundle on a command that impersonates git'
            '-tulpn' = 'ss -tulpn — flags of a NATIVE command being taught, not PowerFlow flags'
            '-srv'   = 'ls -srv <name> — a named root ANCHOR, not a flag'
            '-pics'  = 'nav -pics — a named root ANCHOR, not a flag'
          }

          $offenders = @()
          foreach ($file in (Get-ChildItem components, windows-only, platform -Recurse -Filter *.ps1)) {
            $text = Get-Content $file.FullName -Raw
            # Register-PFCommand spans continuation lines, so match the call plus any lines it
            # continues onto with a backtick.
            foreach ($call in [regex]::Matches($text, '(?m)^Register-PFCommand(?:[^\r\n]*`\r?\n)*[^\r\n]*')) {
              $cmd = [regex]::Match($call.Value, "-Name\s+'([^']+)'").Groups[1].Value
              foreach ($tok in [regex]::Matches($call.Value, "(?<![\w-])(-[a-z][a-z0-9-]{2,})(?![\w-])")) {
                $flag = $tok.Groups[1].Value
                # Register-PFCommand's own parameters are not part of the command's surface.
                if ($flag -in @('-aliases','-synopsis','-example','-section','-name','-platform')) { continue }
                if ($allowed.ContainsKey($flag)) { continue }
                $offenders += "   $cmd teaches '$flag' — should be '-$flag' ($($file.Name))"
              }
            }
          }

          if ($offenders) {
            Write-Error "❌ registered help text teaches a single-dash WORD; the convention is one dash for a letter, two for a word:"
            $offenders | Sort-Object -Unique | ForEach-Object { Write-Host $_ }
            Write-Host ""
            Write-Host "   If the token is a GNU bundle or a named root anchor, add it to the allow-list in this gate with the reason."
            exit 1
          }
          Write-Host "✅ registered help text uses the canonical flag spelling"

      # A Linux bindings file must never come back. It existed only to undo the shadowing that
      # the gate above now prevents at the source, and its removal is the point — a file that
      # conditionally undoes an unconditional hazard is strictly worse than not creating the
      # hazard. Windows still has one, and that is fine: it only ADDS names.
      - name: 🐧 Linux needs no bindings file
        shell: pwsh
        run: |
          if (Test-Path 'platform/linux/bindings.ps1') {
            Write-Error "❌ platform/linux/bindings.ps1 is back. If it exists to un-shadow a coreutil, fix the name in components/ instead — see CLAUDE.md, 'Command Shadowing on Linux'."
            exit 1
          }
          Write-Host "✅ no Linux bindings file — nothing needs unbinding"

      # PowerShell AUTOMATIC variables are not yours to use as locals. This class has now
      # produced four separate bugs here, the worst of which shipped past a green test run:
      # Get-PmxStableIds did `$matches = @()` and then ran `-match` in the loop, which
      # rewrites $matches into a Hashtable of capture groups — so the next `$matches += $path`
      # threw "A hash table can only be added to another hash table" and aborted EVERY pmx
      # disk command on any host whose /dev/disk/by-id contains a *-partN link (i.e. all of
      # them). Reading $matches straight after a -match is correct and stays allowed; what is
      # banned is ASSIGNING to an automatic name.
      - name: 🔤 No automatic variable used as a local
        shell: pwsh
        run: |
          # Writable-but-reserved, plus the read-only ones (assigning those throws outright).
          $auto = 'matches|args|input|error|host|this|foreach|switch|sender|event|eventArgs|' +
                  'PSItem|ofs|profile|pwd|home|PSHome|pid|PSVersionTable|IsWindows|IsLinux|' +
                  'IsMacOS|ShellId|ExecutionContext|PSCmdlet|PSBoundParameters|MyInvocation'
          # `$name =` or `$name +=`, but NOT `$name -eq`/`==`, and never inside a comment.
          $pattern = '(?<!\w)\$(' + $auto + ')\s*(\+)?=(?!=)'

          $hits = Get-ChildItem components, platform, config, windows-only -Recurse -Filter *.ps1 -ErrorAction SilentlyContinue |
                  Select-String -CaseSensitive:$false -Pattern $pattern |
                  Where-Object { $_.Line -notmatch '^\s*#' } |
                  Where-Object { $_.Line -notmatch '\$null\s*=' }   # $null = ... is the idiomatic discard

          if ($hits) {
            Write-Error "❌ an automatic variable is being assigned as a local — rename it:"
            $hits | ForEach-Object { Write-Host "   $($_.RelativePath ?? $_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            Write-Host ""
            Write-Host "   Reading `$matches immediately after a -match is fine. Assigning is not."
            exit 1
          }
          Write-Host "✅ no automatic variable is shadowed by a local"

      # pwsh-h renders from the command registry. A user-facing command that exists
      # without a registration is invisible help — the exact drift that let 4 commands
      # vanish from the old hand-drawn menu and let `ls -t` stay documented as "tree
      # view" a full version after it became GNU time-sort.
      - name: 📖 Help registry covers every command
        shell: pwsh
        run: |
          $files = Get-ChildItem components, windows-only -Recurse -Filter *.ps1

          # User-facing = kebab/lowercase names. PowerShell Verb-Noun names are internal
          # helpers (COMPONENTS.md documents those; pwsh-h does not).
          # -CaseSensitive is LOAD-BEARING: PowerShell regex is case-insensitive by
          # default, so a bare [a-z] would swallow every Verb-Noun helper too.
          $defined = @()
          foreach ($f in $files) {
            $defined += (Select-String -CaseSensitive -Path $f.FullName -Pattern '^function ([a-z][\w\.-]*)\b' |
                         ForEach-Object { $_.Matches[0].Groups[1].Value })
            $defined += (Select-String -CaseSensitive -Path $f.FullName -Pattern '^Set-Alias(?: -Name)? ([a-z][\w\.-]*)' |
                         ForEach-Object { $_.Matches[0].Groups[1].Value })
          }
          $defined = $defined | Sort-Object -Unique

          $registered = @()
          foreach ($f in $files) {
            $raw = Get-Content $f.FullName -Raw
            $registered += [regex]::Matches($raw, "Register-PFCommand\s+-Name\s+'([^']+)'") |
                           ForEach-Object { $_.Groups[1].Value }
            $registered += [regex]::Matches($raw, "-Aliases\s+@\(([^)]+)\)") | ForEach-Object {
                             [regex]::Matches($_.Groups[1].Value, "'([^']+)'") |
                             ForEach-Object { $_.Groups[1].Value } }
          }

          # CASE-FOLD DUPLICATE CHECK. Sort-Object -Unique and -notin are BOTH case-insensitive
          # in PowerShell, so two commands differing only by case collapse into a single entry
          # and this gate was STRUCTURALLY BLIND to them — it could never report the problem.
          #
          # That is how git-bd and git-bD shipped as the same function: the force-delete loaded
          # second and silently replaced the documented-safe one, so typing the safe name
          # force-deleted unmerged work. Names must differ by more than case.
          $byFold = @{}
          foreach ($name in $defined) {
            $fold = $name.ToLowerInvariant()
            if (-not $byFold.ContainsKey($fold)) { $byFold[$fold] = @() }
            $byFold[$fold] += $name
          }
          $collisions = @($byFold.GetEnumerator() | Where-Object { @($_.Value | Sort-Object -CaseSensitive -Unique).Count -gt 1 })
          if ($collisions) {
            foreach ($c in $collisions) {
              Write-Error "CASE COLLISION: $(($c.Value | Sort-Object -CaseSensitive -Unique) -join ', ') differ only by case - PowerShell treats them as ONE function, and whichever loads last wins"
            }
            exit 1
          }
          Write-Host "OK no two commands differ only by case"

          $missing = @($defined | Where-Object { $_ -notin $registered })
          if ($missing) {
            foreach ($m in $missing) {
              Write-Error "❌ '$m' is defined but not registered — add Register-PFCommand beside it"
            }
            exit 1
          }
          Write-Host "✅ all $($defined.Count) user-facing commands are registered ($($registered.Count) registry entries)"

      # ADAPTER PARITY, DERIVED. Nothing here is hand-maintained.
      #
      # This gate used to match component calls against a hardcoded list of ~120 contract
      # names, and the list drifted: two functions added for the container store work
      # (Get-ContainerMachines, Resolve-ContainerConnectionMachine) were called from
      # components/ and were NOT in the regex, so they shipped unchecked. The release
      # checklist even carries an incident note saying the list is not automatic — which
      # means the failure mode was known, documented, and still happened, because a human
      # has to remember it on every adapter change.
      #
      # So the contract is now computed: it is the set of adapter-defined functions that
      # components/ actually calls. Adding an adapter function needs no edit here, and one
      # added to only one platform fails immediately.
      - name: 🔌 Verify Adapter Contract Parity
        shell: pwsh
        run: |
          function Get-Defined($path) {
            if (-not (Test-Path $path)) { return @() }
            return @(Get-ChildItem $path -Recurse -Filter *.ps1 |
              Select-String -Pattern '^function ([A-Za-z][A-Za-z0-9-]*)' |
              ForEach-Object { $_.Matches[0].Groups[1].Value })
          }

          $win   = Get-Defined 'platform/windows/adapters'
          $linux = Get-Defined 'platform/linux/adapters'
          $adapterAll = @($win + $linux | Sort-Object -Unique)

          # Anything components/ (or config/) defines for itself is not an adapter call.
          $localDefined = @((Get-Defined 'components') + (Get-Defined 'config') +
                            (Get-Defined 'windows-only') + (Get-Defined 'platform/windows') +
                            (Get-Defined 'platform/linux') | Sort-Object -Unique)
          $localOnly = @($localDefined | Where-Object { $_ -notin $adapterAll })

          # Collect Verb-Noun calls from comment-stripped source: a name mentioned only in
          # prose is not a call, and three tests in this repo have already been fooled by
          # matching their own explanatory comments.
          $called = New-Object System.Collections.Generic.HashSet[string]
          foreach ($file in (Get-ChildItem components, config -Recurse -Filter *.ps1)) {
            $tokens = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$null)
            foreach ($tok in @($tokens | Where-Object { $_.Kind -eq 'Identifier' -or $_.Kind -eq 'Generic' })) {
              if ($tok.Text -cmatch '^[A-Z][A-Za-z0-9]*-[A-Za-z][A-Za-z0-9-]*$') { $null = $called.Add($tok.Text) }
            }
          }

          # The CONTRACT: names components/ calls that an adapter provides.
          $contract = @($called | Where-Object { $_ -in $adapterAll } | Sort-Object)

          $failed = $false
          foreach ($c in $contract) {
            $inWin = $win -contains $c
            $inLinux = $linux -contains $c
            if (-not $inWin -or -not $inLinux) {
              $where = @(if (-not $inWin) { 'windows' }; if (-not $inLinux) { 'linux' }) -join ', '
              Write-Error "❌ '$c' is called by components/ but is MISSING on: $where"
              $failed = $true
            }
          }

          # A Verb-Noun call that resolves nowhere is almost always a typo or an invented
          # name. That has happened here: a helper was called as Format-PmxIecBytes when the
          # real function was Format-PmxBytes, and nothing caught it until it was run.
          $builtins = @(Get-Command -CommandType Cmdlet, Function -ErrorAction SilentlyContinue |
                        ForEach-Object { $_.Name })
          $unresolved = @($called | Where-Object {
            $_ -notin $adapterAll -and $_ -notin $localOnly -and $_ -notin $builtins
          } | Sort-Object)
          if ($unresolved) {
            foreach ($u in $unresolved) {
              Write-Error "❌ '$u' is called by components/ but is defined nowhere and is not a cmdlet - typo, or an invented name?"
            }
            $failed = $true
          }

          if ($failed) { exit 1 }
          Write-Host "✅ All $($contract.Count) adapter calls resolve on BOTH platforms, and every Verb-Noun call resolves somewhere"
      - name: 🧪 PMX parser, routing, adapter, and mutation regressions
        shell: pwsh
        run: ./tests/proxmox/run.ps1

      - name: 🎨 Scoop prerequisite and Windows Nerd Font regression
        shell: pwsh
        run: ./tests/windows/run.ps1

      - name: 🔐 SRV alias-only display and authenticated info regression
        shell: pwsh
        run: ./tests/network/run.ps1

      - name: 🐳 dkr/pman engine parity, compose-correctness, and flag parsing
        shell: pwsh
        run: ./tests/containers/run.ps1

      - name: 🗄️ storage volume enumeration, mount filtering, and selector resolution
        shell: pwsh
        run: ./tests/storage/run.ps1

      - name: "\U0001F4C2 GNU argument parsing, coreutil names, and the del/mvf contract"
        shell: pwsh
        run: ./tests/files/run.ps1

      - name: 🏷️ Flag convention - one dash for a letter, two for a word
        shell: pwsh
        run: ./tests/flags/run.ps1

      - name: 🎯 git-rl points at the setup flow instead of "cancelled", and writes nothing
        shell: pwsh
        run: ./tests/git/run.ps1
